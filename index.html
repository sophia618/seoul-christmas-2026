<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17342b">
  <meta name="description" content="热汤、灯河与一场未完待续的音乐剧：2026 首尔圣诞行地图">
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.de" crossorigin>
  <link rel="preconnect" href="https://a.tile.openstreetmap.fr" crossorigin>
  <title>首尔，圣诞行 · 2026</title>
  <style>
    :root {
      --ink: #17342b;
      --ink-soft: #35594f;
      --paper: #f6f1e7;
      --paper-deep: #e9e0cf;
      --panel: #fffdf7;
      --line: #cfc5b2;
      --river: #a9d4dc;
      --river-deep: #77b3c1;
      --green: #2f735b;
      --green-pale: #dce9dc;
      --orange: #d66043;
      --orange-pale: #f5ddcf;
      --blue: #376d8c;
      --blue-pale: #dce8ee;
      --gold: #b47b30;
      --gold-pale: #f1e3c8;
      --plum: #7c5368;
      --plum-pale: #ebdfe5;
      --shadow: 0 18px 48px rgba(39, 48, 39, .16);
      --radius: 18px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --section-nav-height: 46px;
      --mobile-topbar-height: 70px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.76), transparent 28rem),
        var(--paper);
      color: var(--ink);
      font-family: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid rgba(214, 96, 67, .48);
      outline-offset: 3px;
    }

    .brand-mark svg,
    .section-nav svg,
    .map-title-chip svg,
    .map-marker svg,
    .map-control svg,
    .detail-close svg,
    .action-link svg,
    .empty-detail svg,
    .route-note svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-shell {
      height: 100svh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      overflow: hidden;
    }

    .topbar {
      min-height: 78px;
      padding: 14px clamp(16px, 2.4vw, 34px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid rgba(23, 52, 43, .16);
      background: rgba(246, 241, 231, .9);
      backdrop-filter: blur(14px);
      position: relative;
      z-index: 50;
    }

    .brand {
      flex: 1 1 auto;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--paper);
      background: var(--ink);
      flex: 0 0 auto;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    }

    .brand-mark svg { width: 22px; height: 22px; }
    .brand-copy { flex: 1; min-width: 0; }

    .eyebrow {
      margin: 0 0 2px;
      font-size: 11px;
      line-height: 1.35;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 750;
    }

    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Baskerville", "Times New Roman", serif;
      font-size: clamp(24px, 2.8vw, 38px);
      line-height: 1.04;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .header-intro {
      max-width: none;
      margin: 7px 0 0;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.55;
      font-weight: 520;
    }

    .header-intro strong { color: var(--ink); }

    .trip-summary {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .summary-block {
      padding: 7px 12px;
      border-left: 1px solid var(--line);
      min-width: 92px;
    }

    .summary-block:first-child { border-left: 0; }

    .summary-label {
      display: block;
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 760;
      margin-bottom: 3px;
    }

    .summary-value {
      display: block;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 760;
      white-space: nowrap;
    }

    .section-nav {
      min-height: var(--section-nav-height);
      padding: 6px clamp(16px, 2.4vw, 34px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(23, 52, 43, .14);
      background:
        linear-gradient(90deg, rgba(220, 233, 220, .42), rgba(245, 221, 207, .28)),
        rgba(233, 224, 207, .72);
      position: relative;
      z-index: 48;
    }

    .section-nav-list {
      width: min(100%, 760px);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .section-nav-link {
      min-width: 0;
      min-height: 34px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid rgba(23, 52, 43, .14);
      border-radius: 8px;
      color: var(--ink-soft);
      background: rgba(255, 253, 247, .72);
      box-shadow: 0 2px 9px rgba(23, 52, 43, .045);
      font-size: 12px;
      line-height: 1;
      font-weight: 780;
      text-decoration: none;
      white-space: nowrap;
      transition:
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        transform .2s ease;
    }

    .section-nav-link svg { width: 15px; height: 15px; flex: 0 0 auto; }

    .section-nav-link:hover {
      color: var(--ink);
      background: rgba(255, 253, 247, .96);
      border-color: rgba(23, 52, 43, .28);
      box-shadow: 0 8px 18px rgba(23, 52, 43, .13);
      transform: translateY(-2px);
    }

    .section-nav-link[aria-current] {
      color: var(--paper);
      background: var(--ink);
      border-color: var(--ink);
      box-shadow: 0 6px 15px rgba(23, 52, 43, .2);
    }

    .section-target { scroll-margin-top: 12px; }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: clamp(370px, 31vw, 460px) minmax(0, 1fr);
    }

    .sidebar {
      min-height: 0;
      display: block;
      background: rgba(255, 253, 247, .65);
      border-right: 1px solid rgba(23, 52, 43, .15);
      position: relative;
      z-index: 30;
    }

    .sidebar-head {
      padding: 18px 18px 12px;
    }

    .section-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 11px;
    }

    .section-title {
      margin: 0;
      font-family: "Iowan Old Style", "Baskerville", "Times New Roman", serif;
      font-size: 22px;
      line-height: 1.1;
      font-weight: 600;
    }

    .countdown {
      font-size: 11px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .06em;
      color: var(--orange);
      white-space: nowrap;
      padding: 8px 9px;
      border: 1px solid rgba(214, 96, 67, .26);
      border-radius: 999px;
      background: var(--orange-pale);
    }

    .day-tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      padding: 4px;
      border: 1px solid rgba(23, 52, 43, .15);
      border-radius: 999px;
      background: rgba(233, 224, 207, .62);
    }

    .day-tab {
      min-height: 37px;
      padding: 6px 5px;
      border: 0;
      border-radius: 999px;
      color: var(--ink-soft);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.1;
      font-weight: 760;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .day-tab:hover {
      background: rgba(255,255,255,.55);
      box-shadow: 0 6px 14px rgba(23, 52, 43, .1);
      transform: translateY(-1px);
    }
    .day-tab[aria-pressed="true"] {
      color: var(--paper);
      background: var(--ink);
      box-shadow: 0 5px 15px rgba(23, 52, 43, .2);
    }

    .day-tab small {
      display: block;
      margin-top: 2px;
      font-size: 9px;
      font-weight: 650;
      opacity: .75;
    }

    .timeline-scroll {
      height: 100%;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(23, 52, 43, .25) transparent;
      padding: 2px 14px 28px;
    }

    .timeline-scroll > .sidebar-head {
      padding: 18px 4px 12px;
    }

    .day-group { padding: 14px 4px 7px; }
    .day-group[hidden] { display: none; }

    .day-group-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .day-date {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .day-number {
      font-family: "Iowan Old Style", "Baskerville", "Times New Roman", serif;
      font-size: 29px;
      line-height: 1;
      font-weight: 650;
    }

    .day-week {
      font-size: 12px;
      font-weight: 760;
      color: var(--ink-soft);
    }

    .day-theme {
      max-width: 45%;
      text-align: right;
      font-size: 11px;
      line-height: 1.3;
      color: var(--ink-soft);
      font-weight: 650;
    }

    .timeline {
      list-style: none;
      margin: 0;
      padding: 0 0 0 6px;
    }

    .timeline-item {
      position: relative;
      padding: 0 0 10px 28px;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 22px;
      bottom: -2px;
      width: 1px;
      background: var(--line);
    }

    .timeline-item:last-child::before { display: none; }

    .timeline-dot {
      position: absolute;
      left: 2px;
      top: 16px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--panel);
      border: 2px solid var(--ink);
      box-shadow: 0 0 0 3px var(--paper);
    }

    .timeline-dot.rest {
      border-style: dashed;
      border-color: var(--ink-soft);
      background: transparent;
    }

    .timeline-button {
      width: 100%;
      min-height: 58px;
      padding: 12px 12px 11px;
      text-align: left;
      color: var(--ink);
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .timeline-button:hover {
      background: rgba(255,255,255,.7);
      border-color: rgba(23, 52, 43, .12);
      box-shadow: 0 10px 22px rgba(23, 52, 43, .08);
      transform: translateY(-2px) rotateX(1deg);
    }

    .timeline-button.is-selected {
      background: var(--panel);
      border-color: rgba(23, 52, 43, .17);
      box-shadow: 0 8px 22px rgba(42, 50, 39, .08);
    }

    .timeline-button.static { cursor: default; }
    .timeline-button.static:hover { transform: none; background: transparent; border-color: transparent; }

    .time-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }

    .time {
      font-size: 11px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .05em;
      color: var(--orange);
    }

    .mini-tag {
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 9px;
      line-height: 1;
      font-weight: 780;
      letter-spacing: .05em;
      color: var(--ink-soft);
      background: var(--paper-deep);
      white-space: nowrap;
    }

    .mini-tag.wait {
      color: var(--plum);
      background: var(--plum-pale);
    }

    .timeline-name {
      display: block;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 760;
    }

    .timeline-note {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.45;
      color: var(--ink-soft);
    }

    .map-shell {
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: #e7eadf;
    }

    .map-toolbar {
      position: absolute;
      z-index: 20;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      pointer-events: none;
    }

    .map-toolbar > * { pointer-events: auto; }

    .map-title-chip {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 13px;
      border: 1px solid rgba(23, 52, 43, .14);
      border-radius: 11px;
      background: rgba(255,253,247,.9);
      backdrop-filter: blur(10px);
      box-shadow: 0 9px 26px rgba(42, 50, 39, .09);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 760;
    }

    .map-title-chip svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
      max-width: 440px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-radius: 999px;
      border: 1px solid rgba(23, 52, 43, .12);
      background: rgba(255,253,247,.88);
      backdrop-filter: blur(8px);
      font-size: 10px;
      line-height: 1;
      font-weight: 730;
      color: var(--ink-soft);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }

    .legend-dot.shop { background: var(--blue); }
    .legend-dot.show { background: var(--plum); }
    .legend-dot.event { background: var(--orange); }

    .map-viewport {
      width: 100%;
      height: 100%;
      min-height: 540px;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
      position: relative;
    }

    .map-viewport.is-dragging { cursor: grabbing; }

    .map-stage {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    .tile-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #e5e8dd;
    }

    .tile-layer img {
      position: absolute;
      width: 256px;
      height: 256px;
      display: block;
      object-fit: cover;
      opacity: 0;
      filter: saturate(.55) contrast(.94) brightness(1.06);
      transition: opacity .2s ease;
      user-select: none;
      pointer-events: none;
    }

    .tile-layer img.is-loaded { opacity: .93; }
    .tile-layer img.is-error { opacity: 0; }

    .seoul-map {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    #schematicBase {
      transition: opacity .25s ease;
    }

    .map-shell.tiles-active #schematicBase,
    .map-shell.tiles-active #routeLayer {
      opacity: 0;
    }

    .route-overlay {
      position: absolute;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .map-shell.tiles-active .route-overlay {
      opacity: 1;
    }

    .map-district {
      stroke: rgba(23, 52, 43, .13);
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
    }

    .road {
      fill: none;
      stroke: rgba(255, 253, 247, .9);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .road.major {
      stroke: #fffdf7;
      stroke-width: 7;
    }

    .road.edge {
      stroke: rgba(255,255,255,.52);
      stroke-width: 2;
    }

    .block-line {
      fill: none;
      stroke: rgba(23, 52, 43, .08);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .park { fill: #bed3b8; stroke: rgba(47,115,91,.18); stroke-width: 1; }
    .river { fill: var(--river); }
    .river-detail { fill: none; stroke: rgba(255,255,255,.65); stroke-width: 2; }

    .area-label {
      fill: rgba(23, 52, 43, .55);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .08em;
      text-anchor: middle;
      pointer-events: none;
    }

    .area-label.small { font-size: 11px; letter-spacing: .05em; fill: rgba(23,52,43,.45); }

    .route-line {
      fill: none;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 8 8;
      opacity: .9;
      vector-effect: non-scaling-stroke;
      transition: opacity .2s ease;
    }

    .route-line.day-1 { stroke: var(--orange); }
    .route-line.day-2 { stroke: var(--green); }
    .route-line.day-3 { stroke: var(--blue); }
    .route-line.day-4 { stroke: var(--gold); }
    .route-line.is-muted { opacity: .08; }

    .marker-stem {
      stroke: rgba(23, 52, 43, .48);
      stroke-width: 1.2;
      stroke-dasharray: 2 3;
      vector-effect: non-scaling-stroke;
    }

    .markers-layer {
      position: absolute;
      z-index: 3;
      inset: 0;
      pointer-events: none;
    }

    .map-marker {
      position: absolute;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: var(--green);
      box-shadow: 0 7px 16px rgba(23, 52, 43, .25), 0 0 0 3px rgba(255,253,247,.78);
      transform: translate(-50%, -50%);
      transform-origin: center;
      cursor: pointer;
      pointer-events: auto;
      transition: opacity .18s ease, box-shadow .18s ease, transform .18s ease;
    }

    .map-marker:hover,
    .map-marker[aria-pressed="true"] {
      box-shadow: 0 9px 22px rgba(23, 52, 43, .36), 0 0 0 4px rgba(255,253,247,.95), 0 0 0 7px rgba(214,96,67,.22);
      transform: translate(-50%, -50%) translateY(-3px) scale(1.09);
      z-index: 8;
    }

    .map-marker.is-muted { opacity: .17; pointer-events: none; }

    .map-marker .marker-glyph {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    .map-marker svg { width: 17px; height: 17px; stroke-width: 2.2; }
    .map-marker.shop { background: var(--blue); }
    .map-marker.show { background: var(--plum); }
    .map-marker.event { background: var(--orange); }
    .map-marker.hotel { background: var(--ink); }
    .map-marker.choice-pending {
      color: var(--ink);
      background: rgba(255,253,247,.96);
      border: 2px dashed var(--ink);
      box-shadow: 0 6px 16px rgba(23, 52, 43, .18), 0 0 0 3px rgba(255,253,247,.72);
    }

    .marker-index {
      position: absolute;
      left: 50%;
      top: calc(100% + 7px);
      transform: translateX(-50%);
      padding: 3px 5px;
      border-radius: 5px;
      color: var(--ink);
      background: rgba(255,253,247,.92);
      font-size: 8.5px;
      line-height: 1;
      font-weight: 850;
      white-space: nowrap;
      box-shadow: 0 3px 8px rgba(23,52,43,.11);
      max-width: 104px;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity .16s ease, transform .16s ease;
    }

    .markers-layer.labels-hidden .marker-index {
      opacity: 0;
      transform: translateX(-50%) scale(.82);
      pointer-events: none;
    }

    .map-controls {
      position: absolute;
      z-index: 22;
      right: 18px;
      bottom: 18px;
      display: grid;
      gap: 6px;
    }

    .map-control {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(23, 52, 43, .16);
      border-radius: 10px;
      color: var(--ink);
      background: rgba(255,253,247,.94);
      backdrop-filter: blur(8px);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(23,52,43,.11);
    }

    .map-control:hover { background: #fff; }
    .map-control svg { width: 18px; height: 18px; }

    .map-control:disabled {
      opacity: .42;
      cursor: not-allowed;
      background: rgba(255,253,247,.72);
    }

    .map-hint {
      position: absolute;
      z-index: 21;
      left: 18px;
      bottom: 18px;
      padding: 8px 10px;
      border-radius: 8px;
      color: var(--ink-soft);
      background: rgba(255,253,247,.82);
      backdrop-filter: blur(8px);
      font-size: 10px;
      line-height: 1.2;
      font-weight: 680;
      pointer-events: none;
    }

    .map-hint strong {
      color: var(--ink);
      font-weight: 850;
    }

    .map-attribution {
      position: absolute;
      z-index: 21;
      right: 72px;
      bottom: 20px;
      padding: 5px 7px;

      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 999px;
      color: var(--blue);
      background: var(--blue-pale);
      font-size: 8.5px;
      line-height: 1;
      font-weight: 820;
      text-decoration: none;
      white-space: nowrap;
    }

    .wilson-note-link:hover { text-decoration: underline; }
    .wilson-note-link svg { width: 11px; height: 11px; }

    .wilson-swatches {
      display: flex;
      gap: 5px;
      margin: 7px 0 0;
    }

    .wilson-swatch {
      width: 22px;
      height: 12px;
      border: 2px solid rgba(255,255,255,.9);
      border-radius: 999px;
      box-shadow: 0 2px 7px rgba(23,52,43,.16);
    }

    .wilson-store-head { margin-top: 2px; }

    .oy-check-tag {
      padding: 4px 7px;
      border-radius: 999px;
      color: var(--green);
      background: var(--green-pale);
      font-size: 8px;
      line-height: 1;
      font-weight: 820;
      white-space: nowrap;
    }

    .oy-store-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid rgba(23, 52, 43, .13);
      border-radius: 9px;
      background: rgba(255,255,255,.62);
    }

    .oy-store-card strong,
    .oy-store-card small { display: block; }
    .oy-store-card strong { font-size: 12px; line-height: 1.35; }
    .oy-store-card small {
      margin-top: 3px;
      color: var(--ink-soft);
      font-size: 9px;
      line-height: 1.45;
    }

    .oy-store-card a {
      flex: 0 0 auto;
      padding: 7px 9px;
      border: 1px solid rgba(23,52,43,.2);
      border-radius: 7px;
      color: var(--ink);
      font-size: 9px;
      font-weight: 780;
      text-decoration: none;
    }

    .oy-store-card a:hover {
      color: var(--paper);
      background: var(--ink);
    }

    .mobile-daybar { display: none; }

    @media (max-width: 980px) {
      .topbar { min-height: 70px; }
      .summary-block:nth-child(2) { display: none; }
      .workspace { grid-template-columns: minmax(340px, 38vw) minmax(0, 1fr); }
      .legend { max-width: 290px; }
      .legend-item:nth-child(n+4) { display: none; }
    }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .app-shell {
        display: block;
        height: auto;
        min-height: 100svh;
        overflow: visible;
      }
      .topbar {
        padding: 12px 14px;
        gap: 10px;
        position: sticky;
        top: 0;
      }
      .section-nav {
        min-height: var(--section-nav-height);
        padding: 5px 8px;
        position: sticky;
        top: var(--mobile-topbar-height);
        z-index: 48;
        backdrop-filter: blur(12px);
      }
      .section-nav-list { gap: 5px; }
      .section-nav-link {
        min-height: 34px;
        padding: 6px 3px;
        gap: 4px;
        font-size: 10px;
      }
      .section-nav-link svg { width: 13px; height: 13px; }
      .section-target {
        scroll-margin-top: calc(var(--mobile-topbar-height) + var(--section-nav-height) + 12px);
      }
      .brand-mark { width: 38px; height: 38px; }
      h1 { font-size: 24px; }
      .eyebrow { font-size: 9px; }
      .header-intro {
        margin-top: 5px;
        font-size: 10px;
        line-height: 1.45;
      }
      .trip-summary { gap: 0; }
      .summary-block { min-width: 76px; padding: 4px 8px; }
      .summary-block:nth-child(2) { display: none; }
      .summary-value { font-size: 12px; }
      .summary-label { font-size: 8px; }

      .workspace { display: flex; flex-direction: column; }
      .map-shell {
        order: 1;
        height: min(61svh, 620px);
        min-height: 460px;
        border-bottom: 1px solid rgba(23,52,43,.16);
      }
      .map-viewport { min-height: 100%; }
      .map-toolbar { top: 10px; left: 10px; right: 10px; }
      .map-title-chip { padding: 8px 10px; font-size: 10px; }
      .map-title-chip svg { width: 14px; height: 14px; }
      .legend { display: none; }
      .map-controls { right: 10px; bottom: 12px; }
      .map-control { width: 40px; height: 40px; }
      .map-hint { left: 10px; bottom: 12px; }
      .map-marker { width: 34px; height: 34px; }
      .marker-index { font-size: 8px; top: calc(100% + 5px); }

      .sidebar {
        order: 2;
        display: block;
        border-right: 0;
        background: var(--paper);
      }
      .sidebar-head {
        position: relative;
        top: auto;
        z-index: auto;
        padding: 14px 4px 10px;
        background: transparent;
        backdrop-filter: none;
        border-bottom: 0;
      }
      .section-title { font-size: 20px; }
      .timeline-scroll {
        overflow: visible;
        padding: 0 10px calc(28px + var(--safe-bottom));
      }
      .day-group { padding-top: 16px; }
      .trip-footer {
        display: block;
        padding: 24px 18px calc(34px + var(--safe-bottom));
        border-top: 1px solid rgba(23,52,43,.14);
        background: var(--paper-deep);
      }
      .trip-footer h2 {
        margin: 0 0 8px;
        font-family: "Iowan Old Style", "Baskerville", "Times New Roman", serif;
        font-size: 22px;
        font-weight: 600;
      }
      .trip-footer p {
        margin: 0;
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.65;
      }

      .detail-panel {
        position: fixed;
        top: auto;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        max-height: min(72svh, 650px);
        border-radius: 20px 20px 0 0;
        transform: translateY(calc(100% + 20px));
        padding-bottom: var(--safe-bottom);
      }
      .detail-panel.is-open { transform: translateY(0); }
      .detail-panel::before {
        content: "";
        position: absolute;
        top: 7px;
        left: 50%;
        width: 42px;
        height: 4px;
        border-radius: 99px;
        transform: translateX(-50%);
        background: rgba(23,52,43,.2);
      }
      .detail-head { padding-top: 25px; }
      .detail-title { font-size: 27px; }
      .detail-actions { position: sticky; bottom: 0; background: var(--panel); }
    }

    @media (max-width: 420px) {
      .brand-mark { display: none; }
      .summary-block { min-width: 72px; }
      .trip-summary .summary-block:last-child { display: none; }
      .map-shell { min-height: 430px; }
      .map-hint { display: none; }
      .day-tab { font-size: 11px; }
      .map-title-chip { padding: 9px; border-radius: 999px; }
      .map-title-chip span { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

    }

    function applyOutdoorFilter(filterId) {
      const filterButtons = document.querySelectorAll("[data-shop-filter]");
      const optionCards = document.querySelectorAll("[data-outdoor-option]");
      const optionList = document.getElementById("outdoorOptionList");
      const emptyState = document.getElementById("outdoorFilterEmpty");
      let visibleCount = 0;

      filterButtons.forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.shopFilter === filterId ? "true" : "false");
      });

      optionCards.forEach((card) => {
        const isVisible = card.dataset.shopTags.split(" ").includes(filterId);
        card.hidden = !isVisible;
        if (isVisible) visibleCount += 1;
      });

      if (emptyState) emptyState.hidden = visibleCount > 0;
      if (optionList) optionList.scrollTo({ left: 0, behavior: "smooth" });
      const activeOutdoorCard = activePlaceId
        ? Array.from(optionCards).find((card) => card.dataset.outdoorOption === activePlaceId)
        : null;
      if (activeOutdoorCard?.hidden) {
        closeDetail();
      }
    }

    function timeRank(value) {
      const aliases = {
        "上午": "09:00",
        "中午": "12:00",
        "下午": "14:00",
        "傍晚": "17:00",
        "晚上": "20:00"
      };
      const normalized = aliases[value] || value;
      const match = /^(\d{1,2}):(\d{2})$/.exec(normalized);
      return match ? Number(match[1]) * 60 + Number(match[2]) : 9999;
    }

    function project(lat, lng, zoom) {
      const worldSize = TILE_SIZE * Math.pow(2, zoom);
      const clampedLat = Math.max(-85.0511, Math.min(85.0511, lat));
      const sinLat = Math.sin(clampedLat * Math.PI / 180);
      return {
        x: (lng + 180) / 360 * worldSize,
        y: (0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI)) * worldSize,
        worldSize
      };
    }

    function unproject(x, y, zoom) {
      const worldSize = TILE_SIZE * Math.pow(2, zoom);
      const lng = x / worldSize * 360 - 180;
      const n = Math.PI - 2 * Math.PI * y / worldSize;
      const lat = 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
      return { lat, lng };
    }

    function activePlacesForFit(day = activeDay) {
      if (day === "all") return places.filter((place) => !place.scheduleOnly);
      return places.filter((place) => !place.scheduleOnly && (String(place.day) === String(day) || place.id === "voco"));
    }

    function fitMapToPlaces(day = activeDay) {
      const rect = mapViewport.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const selected = activePlacesForFit(day);
      let chosenZoom = MIN_ZOOM;
      const horizontalRoom = Math.max(180, rect.width - (window.innerWidth <= 760 ? 42 : 86));
      const verticalRoom = Math.max(220, rect.height - (window.innerWidth <= 760 ? 130 : 150));

      for (let z = MIN_ZOOM; z <= MAX_ZOOM; z += 1) {
        const projected = selected.map((place) => project(place.lat, place.lng, z));
        const minX = Math.min(...projected.map((point) => point.x));
        const maxX = Math.max(...projected.map((point) => point.x));
        const minY = Math.min(...projected.map((point) => point.y));
        const maxY = Math.max(...projected.map((point) => point.y));
        if (maxX - minX <= horizontalRoom && maxY - minY <= verticalRoom) {
          chosenZoom = z;
        }
      }

      const projected = selected.map((place) => project(place.lat, place.lng, chosenZoom));
      const minX = Math.min(...projected.map((point) => point.x));
      const maxX = Math.max(...projected.map((point) => point.x));
      const minY = Math.min(...projected.map((point) => point.y));
      const maxY = Math.max(...projected.map((point) => point.y));
      const center = unproject((minX + maxX) / 2, (minY + maxY) / 2, chosenZoom);

      const previousZoom = mapState.zoom;
      mapState.centerLat = center.lat;
      mapState.centerLng = center.lng;
      mapState.zoom = chosenZoom;
      switchProviderForZoom(previousZoom, chosenZoom);
      renderMap();
    }

    function applyTileProvider(index) {
      mapState.tileProviderIndex = Math.max(0, Math.min(tileProviders.length - 1, index));
      const provider = tileProviders[mapState.tileProviderIndex];
      mapAttribution.href = provider.attributionUrl;
      mapAttribution.textContent = provider.attribution;
      mapAttribution.target = "_blank";
    }

    function switchProviderForZoom(fromZoom, toZoom) {
      if (fromZoom < 14 && toZoom >= 14 && mapState.tileProviderIndex === 0) {
        mapShell.classList.remove("tiles-active");
        applyTileProvider(1);
      } else if (fromZoom >= 14 && toZoom < 14 && mapState.tileProviderIndex <= 1) {
        mapShell.classList.remove("tiles-active");
        applyTileProvider(0);
      }
    }

    function noteTileLoaded() {
      if (!mapShell.classList.contains("tiles-active")) {
        mapShell.classList.add("tiles-active");
        mapTitleText.textContent = "拖动或缩放，继续加载更细地图";
      }
    }

    function resolveMarkerCollisions(entries, width, height, showLabels) {
      const isMobile = window.innerWidth <= 760;
      const minGap = showLabels ? (isMobile ? 76 : 84) : (isMobile ? 52 : 56);
      const active = entries
        .filter((entry) => entry.visible && entry.x > -30 && entry.x < width + 30 && entry.y > -30 && entry.y < height + 30)
        .map((entry) => ({ ...entry }));

      for (let pass = 0; pass < 100; pass += 1) {
        let moved = false;
        for (let i = 0; i < active.length; i += 1) {
          for (let j = i + 1; j < active.length; j += 1) {
            const a = active[i];
            const b = active[j];
            let dx = b.x - a.x;
            let dy = b.y - a.y;
            let distance = Math.hypot(dx, dy);
            if (distance >= minGap) continue;
            if (distance < .5) {
              const angle = (i * 2.4 + j * 1.7) % (Math.PI * 2);
              dx = Math.cos(angle);
              dy = Math.sin(angle);
              distance = 1;
            }
            const push = (minGap - distance) / 2;
            const ux = dx / distance;
            const uy = dy / distance;
            a.x -= ux * push;
            a.y -= uy * push;
            b.x += ux * push;
            b.y += uy * push;
            moved = true;
          }
        }
        active.forEach((entry) => {
          entry.x = Math.max(24, Math.min(width - 24, entry.x));
          entry.y = Math.max(isMobile ? 66 : 70, Math.min(height - 34, entry.y));
        });
        if (!moved) break;
      }
      return active;
    }

    function renderMap() {
      const rect = mapViewport.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, Math.round(mapState.zoom)));
      mapState.zoom = zoom;
      const center = project(mapState.centerLat, mapState.centerLng, zoom);
      const originX = center.x - rect.width / 2;
      const originY = center.y - rect.height / 2;
      const tileCount = Math.pow(2, zoom);
      const xStart = Math.floor(originX / TILE_SIZE);
      const xEnd = Math.floor((originX + rect.width) / TILE_SIZE);
      const yStart = Math.max(0, Math.floor(originY / TILE_SIZE));
      const yEnd = Math.min(tileCount - 1, Math.floor((originY + rect.height) / TILE_SIZE));
      const centerTileX = Math.floor(center.x / TILE_SIZE);
      const centerTileY = Math.floor(center.y / TILE_SIZE);
      const fragment = document.createDocumentFragment();
      let tileErrors = 0;
      const provider = tileProviders[mapState.tileProviderIndex];

      for (let tileY = yStart; tileY <= yEnd; tileY += 1) {
        for (let tileX = xStart; tileX <= xEnd; tileX += 1) {
          const wrappedX = ((tileX % tileCount) + tileCount) % tileCount;
          const key = `${provider.id}/${zoom}/${wrappedX}/${tileY}`;
          const image = document.createElement("img");
          image.alt = "";
          image.draggable = false;
          image.decoding = "async";
          image.loading = "eager";
          image.fetchPriority = Math.abs(tileX - centerTileX) <= 1 && Math.abs(tileY - centerTileY) <= 1 ? "high" : "low";
          image.referrerPolicy = "strict-origin-when-cross-origin";
          image.style.left = `${tileX * TILE_SIZE - originX}px`;
          image.style.top = `${tileY * TILE_SIZE - originY}px`;
          if (tileCache.has(key)) image.classList.add("is-loaded");
          image.addEventListener("load", () => {
            tileCache.add(key);
            image.classList.add("is-loaded");
            noteTileLoaded();
          }, { once: true });
          image.addEventListener("error", () => {
            tileErrors += 1;
            image.classList.add("is-error");
            if (!providerSwitchLock && tileErrors >= 3 && mapState.tileProviderIndex < tileProviders.length - 1) {
              providerSwitchLock = true;
              mapShell.classList.remove("tiles-active");
              applyTileProvider(mapState.tileProviderIndex + 1);
              setTimeout(() => {
                providerSwitchLock = false;
                renderMap();
              }, 0);
            } else if (!mapShell.classList.contains("tiles-active") && tileErrors >= 3 && mapState.tileProviderIndex === tileProviders.length - 1) {
              mapTitleText.textContent = "地图服务不可用 · 当前显示离线示意地图";
            }
          }, { once: true });
          image.src = provider.url(zoom, wrappedX, tileY);
          fragment.appendChild(image);
        }
      }
      tileLayer.replaceChildren(fragment);

      const showMarkerLabels = zoom >= 14 || activeDay !== "all";
      const markerEntries = places.filter((place) => !place.scheduleOnly).map((place) => {
        const point = project(place.lat, place.lng, zoom);
        return {
          id: place.id,
          rawX: point.x - originX,
          rawY: point.y - originY,
          x: point.x - originX,
          y: point.y - originY,
          visible: activeDay === "all" || String(place.day) === activeDay || place.id === "voco"
        };
      });
      const resolvedMarkers = resolveMarkerCollisions(markerEntries, rect.width, rect.height, showMarkerLabels);
      const resolvedById = new Map(resolvedMarkers.map((entry) => [entry.id, entry]));
      markersLayer.classList.toggle("labels-hidden", !showMarkerLabels);

      routeOverlay.setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);
      const routeMarkup = [1, 2, 3, 4].map((day) => {
        const routePoints = places
          .filter((place) => place.day === day && !place.mapOnly && !place.scheduleOnly)
          .sort((a, b) => timeRank(a.time) - timeRank(b.time))
          .map((place) => {
            const point = project(place.lat, place.lng, zoom);
            return { x: point.x - originX, y: point.y - originY };
          });
        if (routePoints.length < 2) return "";
        const path = routePoints.map((point, index) => `${index === 0 ? "M" : "L"}${point.x.toFixed(1)} ${point.y.toFixed(1)}`).join(" ");
        const muted = activeDay !== "all" && String(day) !== activeDay;
        return `<path class="route-line day-${day} ${muted ? "is-muted" : ""}" d="${path}"/>`;
      }).join("");
      const stemMarkup = resolvedMarkers
        .filter((entry) => Math.hypot(entry.x - entry.rawX, entry.y - entry.rawY) > 5)
        .map((entry) => `<line class="marker-stem" x1="${entry.rawX.toFixed(1)}" y1="${entry.rawY.toFixed(1)}" x2="${entry.x.toFixed(1)}" y2="${entry.y.toFixed(1)}"/>`)
        .join("");
      routeOverlay.innerHTML = routeMarkup + stemMarkup;

      markersLayer.querySelectorAll(".map-marker").forEach((marker) => {
        const entry = resolvedById.get(marker.dataset.placeId) || markerEntries.find((item) => item.id === marker.dataset.placeId);
        if (!entry) return;
        marker.style.left = `${entry.x}px`;
        marker.style.top = `${entry.y}px`;
        marker.classList.toggle("is-muted", !entry.visible);
      });

      zoomLevel.textContent = `Z${zoom}`;
      document.getElementById("zoomIn").disabled = zoom >= MAX_ZOOM;
      document.getElementById("zoomOut").disabled = zoom <= MIN_ZOOM;
      mapTitleText.textContent = zoom >= MAX_ZOOM
        ? "已到最大缩放 · 当前为可靠街区地图"
        : zoom >= 14
          ? "街区细节已加载 · 点击点位查看行程"
          : "拖动或缩放，继续加载更细地图";
      mapStage.style.transform = "translate(0px, 0px)";
      mapState.initialized = true;
    }

    function selectDay(day) {
      activeDay = String(day);
      document.querySelectorAll(".day-tab").forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.day === activeDay ? "true" : "false");
      });
      document.querySelectorAll("[data-day-group]").forEach((group) => {
        group.hidden = activeDay !== "all" && group.dataset.dayGroup !== activeDay;
      });
      closeDetail();
      fitMapToPlaces(activeDay);
      if (window.innerWidth <= 760) {
        const top = mapShell.getBoundingClientRect().top + window.scrollY - 70;
        window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
      }
    }

    function placeById(id) {
      return places.find((place) => place.id === id);
    }

    function openPlace(id, shouldZoom = true) {
      const place = placeById(id);
      if (!place) return;
      activePlaceId = id;
      document.querySelectorAll(".map-marker").forEach((marker) => {
        marker.setAttribute("aria-pressed", marker.dataset.placeId === id ? "true" : "false");
      });
      document.querySelectorAll(".timeline-button").forEach((button) => {
        button.classList.toggle("is-selected", button.dataset.placeId === id);
      });

      detailContent.innerHTML = `
        <div class="detail-head">
          <button class="detail-close" type="button" aria-label="关闭地点详情" id="closeDetail"><svg aria-hidden="true"><use href="#i-close"></use></svg></button>
          <div class="detail-kicker">${place.date} · ${place.time} · ${place.typeLabel}</div>
          <h2 class="detail-title">${place.name}</h2>
          <p class="detail-subtitle">${place.subtitle}</p>
        </div>
        ${place.image ? `
          <figure class="detail-visual">
            <img src="${place.image}" alt="${place.name}" loading="eager" decoding="async" referrerpolicy="no-referrer">
          </figure>
        ` : ""}
        <div class="detail-body">
          <p class="detail-description">${place.description}</p>
          <div class="detail-meta">
            <div class="meta-row"><span class="meta-label">建议停留</span><span class="meta-value">${place.duration}</span></div>
            <div class="meta-row"><span class="meta-label">地址</span><span class="meta-value">${place.address}</span></div>
          </div>
          <p class="detail-tip">${place.tip}</p>
          <div class="detail-actions">
            ${place.links.map((link, index) => `
              <a class="action-link ${index > 0 ? "secondary" : ""}" href="${link.url}" target="_blank" rel="noopener noreferrer">
                <svg aria-hidden="true"><use href="#${link.icon}"></use></svg>${link.label}
              </a>
            `).join("")}
          </div>
        </div>
      `;
      detailPanel.classList.add("is-open");
      detailPanel.scrollTop = 0;
      document.getElementById("closeDetail").addEventListener("click", closeDetail);

      if (shouldZoom && !place.scheduleOnly) focusOnPlace(place);
    }

    function closeDetail() {
      activePlaceId = null;
      detailPanel.classList.remove("is-open");
      document.querySelectorAll(".map-marker").forEach((marker) => marker.setAttribute("aria-pressed", "false"));
      document.querySelectorAll(".timeline-button").forEach((button) => button.classList.remove("is-selected"));
    }

    function focusOnPlace(place) {
      const previousZoom = mapState.zoom;
      mapState.centerLat = place.lat;
      mapState.centerLng = place.lng;
      mapState.zoom = Math.max(mapState.zoom, window.innerWidth <= 760 ? 15 : 16);
      switchProviderForZoom(previousZoom, mapState.zoom);
      renderMap();
    }

    function zoomMap(delta, anchorClientX, anchorClientY) {
      const nextZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, mapState.zoom + delta));
      if (nextZoom === mapState.zoom) return;
      const rect = mapViewport.getBoundingClientRect();
      const oldCenter = project(mapState.centerLat, mapState.centerLng, mapState.zoom);
      const offsetX = Number.isFinite(anchorClientX) ? anchorClientX - rect.left - rect.width / 2 : 0;
      const offsetY = Number.isFinite(anchorClientY) ? anchorClientY - rect.top - rect.height / 2 : 0;
      const factor = Math.pow(2, nextZoom - mapState.zoom);
      const center = unproject(
        (oldCenter.x + offsetX) * factor - offsetX,
        (oldCenter.y + offsetY) * factor - offsetY,
        nextZoom
      );
      mapState.centerLat = center.lat;
      mapState.centerLng = center.lng;
      mapState.zoom = nextZoom;
      switchProviderForZoom(mapState.zoom - delta, nextZoom);
      renderMap();
    }

    function updateCountdown() {
      const now = new Date();
      let label = "";
      if (now < tripStart) {
        const days = Math.ceil((tripStart - now) / 86400000);
        label = `距出发 ${days} 天`;
      } else if (now <= tripEnd) {
        label = "旅程进行中";
      } else {
        label = "旅行回忆";
      }
      document.getElementById("tripCountdown").textContent = label;
      document.getElementById("headerCountdown").textContent = label;
    }

    function syncTopbarHeight() {
      const height = document.querySelector(".topbar").getBoundingClientRect().height;
      document.documentElement.style.setProperty("--mobile-topbar-height", `${Math.ceil(height)}px`);
    }

    const topbarResizeObserver = new ResizeObserver(syncTopbarHeight);
    topbarResizeObserver.observe(document.querySelector(".topbar"));

    function updateSectionNav(targetId) {
      document.querySelectorAll("[data-section-target]").forEach((link) => {
        if (link.dataset.sectionTarget === targetId) {
          link.setAttribute("aria-current", "location");
        } else {
          link.removeAttribute("aria-current");
        }
      });
    }

    function scrollToBoard(targetId) {
      const target = document.getElementById(targetId);
      if (!target) return false;

      updateSectionNav(targetId);
      if (window.innerWidth <= 760) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
        return true;
      }

      if (targetId === "itineraryBoard") {
        timelineScroll.scrollTo({ top: 0, behavior: "smooth" });
        return true;
      }

      const containerRect = timelineScroll.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const top = timelineScroll.scrollTop + targetRect.top - containerRect.top - 12;
      timelineScroll.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
      return true;
    }

    document.querySelectorAll("[data-section-target]").forEach((link) => {
      link.addEventListener("click", (event) => {
        if (scrollToBoard(link.dataset.sectionTarget)) event.preventDefault();
      });
    });

    markersLayer.addEventListener("click", (event) => {
      const marker = event.target.closest(".map-marker");
      if (marker) openPlace(marker.dataset.placeId);
    });

    timelineScroll.addEventListener("click", (event) => {
      const dayButton = event.target.closest(".day-tab");
      if (dayButton) {
        selectDay(dayButton.dataset.day);
        return;
      }
      const filterButton = event.target.closest("[data-shop-filter]");
      if (filterButton) {
        applyOutdoorFilter(filterButton.dataset.shopFilter);
        return;
      }
      const button = event.target.closest("[data-place-id]");
      if (!button) return;
      if ((button.classList.contains("restaurant-card") || button.classList.contains("xmas-card")) && activeDay !== "all") {
        selectDay("all");
      }
      if (window.innerWidth <= 760 && (button.classList.contains("hair-option-map-button") || button.classList.contains("restaurant-card") || button.classList.contains("xmas-card"))) {
        const top = mapShell.getBoundingClientRect().top + window.scrollY - 70;
        window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
      }
      openPlace(button.dataset.placeId);
    });

    document.getElementById("zoomIn").addEventListener("click", () => zoomMap(1));
    document.getElementById("zoomOut").addEventListener("click", () => zoomMap(-1));
    document.getElementById("fitMap").addEventListener("click", () => {
      closeDetail();
      fitMapToPlaces(activeDay);
    });

    mapViewport.addEventListener("pointerdown", (event) => {
      if (event.target.closest(".map-marker") || event.button > 0) return;
      isDragging = true;
      dragMoved = false;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      dragOffsetX = 0;
      dragOffsetY = 0;
      mapViewport.classList.add("is-dragging");
      mapViewport.setPointerCapture(event.pointerId);
    });

    mapViewport.addEventListener("pointermove", (event) => {
      if (!isDragging) return;
      const dx = event.clientX - dragStartX;
      const dy = event.clientY - dragStartY;
      if (Math.abs(dx) + Math.abs(dy) > 4) dragMoved = true;
      dragOffsetX = dx;
      dragOffsetY = dy;
      mapStage.style.transform = `translate(${dx}px, ${dy}px)`;
    });

    function endDrag(event) {
      if (!isDragging) return;
      if (dragMoved) {
        const center = project(mapState.centerLat, mapState.centerLng, mapState.zoom);
        const nextCenter = unproject(
          center.x - dragOffsetX,
          center.y - dragOffsetY,
          mapState.zoom
        );
        mapState.centerLat = nextCenter.lat;
        mapState.centerLng = nextCenter.lng;
        renderMap();
      } else {
        mapStage.style.transform = "translate(0px, 0px)";
      }
      isDragging = false;
      mapViewport.classList.remove("is-dragging");
      if (event.pointerId != null && mapViewport.hasPointerCapture(event.pointerId)) {
        mapViewport.releasePointerCapture(event.pointerId);
      }
    }
    mapViewport.addEventListener("pointerup", endDrag);
    mapViewport.addEventListener("pointercancel", endDrag);

    mapViewport.addEventListener("wheel", (event) => {
      event.preventDefault();
      if (wheelLocked) return;
      wheelLocked = true;
      const direction = event.deltaY > 0 ? -1 : 1;
      zoomMap(direction, event.clientX, event.clientY);
      setTimeout(() => { wheelLocked = false; }, 180);
    }, { passive: false });

    mapViewport.addEventListener("touchstart", (event) => {
      if (event.touches.length !== 2) return;
      isDragging = false;
      dragMoved = true;
      mapViewport.classList.remove("is-dragging");
      mapStage.style.transform = "translate(0px, 0px)";
      const [a, b] = event.touches;
      pinchStartDistance = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    }, { passive: true });

    mapViewport.addEventListener("touchmove", (event) => {
      if (event.touches.length !== 2) return;
      event.preventDefault();
      const [a, b] = event.touches;
      const distance = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const ratio = distance / Math.max(1, pinchStartDistance);
      if (ratio > 1.38 || ratio < .72) {
        const midX = (a.clientX + b.clientX) / 2;
        const midY = (a.clientY + b.clientY) / 2;
        zoomMap(ratio > 1 ? 1 : -1, midX, midY);
        pinchStartDistance = distance;
      }
    }, { passive: false });

    mapViewport.addEventListener("dblclick", (event) => {
      if (event.target.closest(".map-marker")) return;
      zoomMap(1, event.clientX, event.clientY);
    });

    mapViewport.addEventListener("click", (event) => {
      if (!dragMoved && !event.target.closest(".map-marker") && activePlaceId) closeDetail();
      dragMoved = false;
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && activePlaceId) closeDetail();
    });

    let resizeTimer = 0;
    window.addEventListener("resize", () => {
      syncTopbarHeight();
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (mapState.initialized) renderMap();
      }, 120);
    });

    renderMarkers();
    renderTimeline();
    updateCountdown();
    syncTopbarHeight();
    document.fonts?.ready.then(syncTopbarHeight);
    applyTileProvider(0);
    requestAnimationFrame(() => {
      fitMapToPlaces("all");
    });
  </script>
</body>
</html>
